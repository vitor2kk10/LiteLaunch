plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leve.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.leve.launcher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Assinado com a chave de debug só para poder instalar direto
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Sem nenhuma dependência: só o framework do Android -> APK minúsculo.
